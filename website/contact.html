<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Lamago</title>
    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/main.js"></script>
</head>
<body>
    <header class="hero contact-hero">
        <div class="hero-content">
            <h1>Contact Us</h1>
        </div>
    </header>
    <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>
    <section class="section">
        <h2>Get in Touch</h2>
        <form id="contactForm" action="/api/contact" method="post">
            <label>Name:<br><input type="text" name="name" required></label><br>
            <label>Email:<br><input type="email" name="email" required></label><br>
            <label>Message:<br><textarea name="message" required></textarea></label><br>
            <button type="submit" class="btn">Submit</button>
        </form>
        <div id="formMessage" class="hidden">Thank you for reaching out!</div>
    </section>
    <footer>
        <p>&copy; 2023 Lamago</p>
    </footer>
</body>
</html>
